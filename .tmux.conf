unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind-key C-a last-window
bind-key a send-prefix

# tmux's 500ms default makes it sit on a bare ESC before deciding it isn't the
# start of a function/meta key sequence - Emacs feels that delay directly.
# 50ms rather than the commonly-copied 10ms since SSH can split ESC and the
# following byte across packets, which is the normal case here.
set -sg escape-time 50
# 2000 lines (the default) is one `make` away from losing scrollback for
# good; 50000 costs a modest amount of memory per pane in exchange (each pane
# keeps its own buffer for its lifetime). Applies to new windows only -
# existing panes keep whatever limit was in effect when they were created.
set -g history-limit 50000
# emacs is already what tmux infers here (VISUAL/EDITOR are unset repo-wide,
# and emacs is the default absent a "vi" in either), but stated explicitly so
# copy mode doesn't silently flip to vi keys if some host ever sets EDITOR=vi.
setw -g mode-keys emacs

set -g default-terminal "tmux-256color"
# tmux advertises tmux-256color to programs *inside* the session regardless of
# the outer terminal; terminal-features is what tells tmux itself what the
# *outer* terminal (Ghostty) can actually do, since tmux-256color's own
# terminfo entry doesn't claim any of this on its own. Declared explicitly
# rather than relying on tmux's live auto-detection (tmux doesn't ship a
# built-in profile for "ghostty" the way it does for xterm/screen/iTerm) -
# each capability below is confirmed present in the installed xterm-ghostty
# terminfo entry (`infocmp -x xterm-ghostty`: Tc, Ms, Setulc, Smulx, Sync).
# Needs tmux >= 3.2.
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle:sync"
# tmux's set-clipboard default (external) sets the terminal clipboard itself
# but ignores OSC 52 from programs *inside* a pane - the only clipboard path
# that works over SSH with no xclip/xsel/wl-copy installed. Tradeoff: any
# program in a pane can now write the real clipboard via OSC 52 (e.g. `cat`
# on an untrusted file), which is the accepted cost of remote copy working.
set -g set-clipboard on
# Ghostty reports focus; without this Emacs' focus-in-hook/auto-revert can't
# tell when you've come back to the window. Reattach clients after changing.
set -g focus-events on
set -g status off

set -g set-titles on
# The default window titles also have which tmux session its in, but I usually
# stay to one.
set -g set-titles-string "#h #I:#W"

#Start Window Numbering at 1
set -g base-index 1
setw -g pane-base-index 1
# Without this, closing a middle window leaves a numbering gap instead of
# shifting the rest down - respects base-index above.
set -g renumber-windows on
